<div
  class="min-h-screen bg-zinc-950 flex flex-col text-zinc-100 selection:bg-lime-400 selection:text-zinc-950"
>
  <nav class="bg-zinc-900 border-b-2 border-zinc-800">
    <div class="max-w-7xl mx-auto px-6">
      <div class="flex items-center justify-between h-20">
        <div class="flex items-center space-x-4">
          <svg width="32" height="32" viewBox="0 0 120 120" fill="none">
            <rect width="120" height="120" rx="20" fill="#a21caf" />
            <path
              d="M85 35H35V85H85V60H60"
              stroke="#bef264"
              stroke-width="12"
            />
            <rect x="35" y="35" width="25" height="25" fill="#bef264" />
          </svg>
          <span class="font-black text-xl uppercase tracking-widest text-white"
            >Área<span class="text-fuchsia-500">Cliente</span></span
          >
        </div>
        <div class="flex items-center space-x-8">
          <span
            class="text-xs font-bold font-mono text-zinc-400 border-r-2 border-zinc-800 pr-8"
            >{{ usuarioLogado }}</span
          >
          <button
            (click)="authService.logout()"
            class="text-zinc-500 hover:text-lime-400 font-black uppercase text-xs tracking-widest transition"
          >
            [ Encerrar Sessão ]
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto w-full py-16 px-6 flex-1">
    <div class="mb-16">
      <h1
        class="text-6xl font-black uppercase tracking-tighter text-white mb-4"
      >
        Bem-vindo, <span class="text-lime-400">{{ nomeUsuario }}</span>
      </h1>
      <p class="text-zinc-400 text-lg font-mono">
        Monitoramento de Sprints e Entregáveis.
      </p>
    </div>

    <div *ngIf="isLoading" class="space-y-8">
      <div
        *ngFor="let i of [1, 2]"
        class="h-48 bg-zinc-900 border-2 border-zinc-800 animate-pulse"
      ></div>
    </div>

    <div *ngIf="!isLoading" class="space-y-8">
      <div
        *ngFor="let projeto of meusProjetos"
        class="bg-zinc-900 border-2 border-zinc-800 hover:border-fuchsia-600 transition-all duration-300"
      >
        <div class="p-8 border-b-2 border-zinc-800 bg-zinc-950/50 flex justify-between items-start">
          <div>
            <h2 class="text-3xl font-black uppercase tracking-tight text-white mb-2">{{ projeto.title }}</h2>
            <p class="text-zinc-500 font-mono text-xs">SYS_ID: {{ projeto.id.split('-')[0] }}</p>
          </div>

          <span *ngIf="projeto.status !== 'COMPLETED'" class="bg-lime-400 text-zinc-950 px-4 py-2 text-[10px] font-black uppercase tracking-widest shadow-[4px_4px_0_0_rgba(255,255,255,1)]">
            Em Andamento
          </span>
          <span *ngIf="projeto.status === 'COMPLETED'" class="bg-fuchsia-600 text-white px-4 py-2 text-[10px] font-black uppercase tracking-widest shadow-[4px_4px_0_0_rgba(190,242,100,1)]">
            Concluído
          </span>
        </div>

        <div class="p-8">
          <p class="text-zinc-400 leading-relaxed mb-8 max-w-2xl">
            {{ projeto.description }}
          </p>

          <div class="flex">
            <button
              [routerLink]="['/portal/project', projeto.id]"
              class="bg-fuchsia-600 hover:bg-fuchsia-700 text-white font-black uppercase tracking-widest py-4 px-8 shadow-[6px_6px_0_0_rgba(190,242,100,1)] hover:translate-y-[-2px] transition-all flex items-center"
            >
              Acessar Painel da Etapa →
            </button>
          </div>
        </div>
      </div>

      <div
        *ngIf="meusProjetos.length === 0"
        class="bg-zinc-900 border-2 border-dashed border-zinc-700 p-16 text-center"
      >
        <div class="text-6xl mb-6 opacity-20">📭</div>
        <h3 class="text-2xl font-black uppercase tracking-widest text-zinc-500">
          Zero Projetos Vinculados
        </h3>
        <p class="text-zinc-600 mt-2 font-mono">
          Contate o administrador do sistema.
        </p>
      </div>
    </div>
  </main>
</div>
