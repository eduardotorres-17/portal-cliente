<div class="space-y-3">
      <div *ngFor="let user of usuariosDoBanco" class="p-3 bg-gray-50 border border-gray-200 rounded-lg flex justify-between items-center hover:bg-gray-100 transition">
        <div>
          <p class="font-bold text-gray-800">{{ user.name }}</p>
          <span class="px-2 py-1 bg-indigo-100 text-indigo-800 text-xs font-bold rounded-full">
            {{ user.role }}
          </span>
        </div>

        <button
          (click)="authService.login(user.email, user.role)"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded text-sm transition">
          Logar
        </button>
      </div>
    </div>
