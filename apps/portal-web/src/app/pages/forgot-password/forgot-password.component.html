<div
  class="min-h-screen flex bg-zinc-950 font-sans text-zinc-100 selection:bg-lime-400 selection:text-zinc-950"
>
  <div
    class="hidden lg:flex lg:w-1/2 relative items-center justify-center overflow-hidden bg-zinc-900 border-r border-zinc-800"
  >
    <div
      class="absolute inset-0"
      style="
        background-image: radial-gradient(#3f3f46 1px, transparent 1px);
        background-size: 32px 32px;
        opacity: 0.2;
      "
    ></div>

    <div class="relative z-10 p-12 flex flex-col items-center">
      <div class="mb-10 transform hover:scale-105 transition duration-500">
        <svg
          width="120"
          height="120"
          viewBox="0 0 120 120"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <rect width="120" height="120" rx="30" fill="#a21caf" />
          <path
            d="M85 35H35V85H85V60H60"
            stroke="#bef264"
            stroke-width="12"
            stroke-linejoin="bevel"
          />
          <rect x="35" y="35" width="25" height="25" fill="#bef264" />
        </svg>
      </div>

      <h1
        class="text-5xl font-black tracking-tighter text-white mb-6 uppercase"
      >
        Recuperação<span class="text-lime-400">.</span>
      </h1>
      <p class="text-zinc-400 text-lg max-w-sm text-center leading-relaxed">
        Restabeleça suas credenciais para voltar ao console de projetos.
      </p>
    </div>
  </div>

  <div class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12">
    <div class="w-full max-w-md">
      <a
        routerLink="/login"
        class="text-xs font-black uppercase tracking-widest text-zinc-500 hover:text-lime-400 flex items-center mb-12 transition"
      >
        ← Retornar ao Login
      </a>

      <div class="mb-12">
        <h2
          class="text-3xl font-black tracking-tight text-white mb-2 uppercase"
        >
          Redefinir Senha
        </h2>
        <p class="text-zinc-500">
          Autorização necessária para alteração de credenciais.
        </p>
      </div>

      <div
        *ngIf="errorMessage"
        class="mb-8 bg-red-500/10 border-l-4 border-red-500 p-4"
      >
        <p class="text-sm text-red-400 font-bold uppercase tracking-wider">
          {{ errorMessage }}
        </p>
      </div>

      <div
        *ngIf="sucessoMessage"
        class="mb-8 bg-lime-500/10 border-l-4 border-lime-400 p-4"
      >
        <p class="text-sm text-lime-400 font-bold uppercase tracking-wider">
          {{ sucessoMessage }}
        </p>
      </div>

      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="space-y-8">
        <div class="relative group">
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder=" "
            class="block w-full px-0 py-3 text-white bg-transparent border-0 border-b-2 border-zinc-700 appearance-none focus:outline-none focus:ring-0 focus:border-lime-400 peer transition-colors"
            [ngClass]="{
              'border-red-500 focus:border-red-500':
                f['email'].invalid && f['email'].touched,
            }"
          />
          <label
            for="email"
            class="absolute text-sm font-bold uppercase tracking-wider text-zinc-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:left-0 peer-focus:text-lime-400 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6"
          >
            E-mail Corporativo
          </label>
        </div>

        <div class="relative group">
          <input
            type="password"
            id="newPassword"
            formControlName="newPassword"
            placeholder=" "
            class="block w-full px-0 py-3 text-white bg-transparent border-0 border-b-2 border-zinc-700 appearance-none focus:outline-none focus:ring-0 focus:border-fuchsia-500 peer transition-colors"
            [ngClass]="{
              'border-red-500 focus:border-red-500':
                f['newPassword'].invalid && f['newPassword'].touched,
            }"
          />
          <label
            for="newPassword"
            class="absolute text-sm font-bold uppercase tracking-wider text-zinc-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:left-0 peer-focus:text-fuchsia-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6"
          >
            Nova Senha (Mín. 6 char)
          </label>
        </div>

        <button
          type="submit"
          [disabled]="isLoading || sucessoMessage"
          class="w-full bg-lime-400 hover:bg-lime-500 text-zinc-950 font-black uppercase tracking-widest py-4 px-4 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed transform hover:-translate-y-1 hover:shadow-[0_10px_0_0_rgba(162,28,175,1)]"
        >
          {{ isLoading ? 'Processando...' : 'Atualizar Senha' }}
        </button>
      </form>
    </div>
  </div>
</div>
