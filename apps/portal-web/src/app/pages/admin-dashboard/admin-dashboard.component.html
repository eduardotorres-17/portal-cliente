<div class="min-h-screen bg-gray-100 font-sans">
  <nav class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center">
          <span class="font-bold text-xl">🚀 Portal Admin</span>
        </div>
        <div class="flex items-center space-x-4">
          <span class="text-sm font-medium opacity-80"
            >Logado como: {{ usuarioLogado }}</span
          >
          <button
            (click)="authService.logout()"
            class="bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 rounded text-sm font-bold transition"
          >
            Sair
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Meus Projetos</h1>
      <button
        class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded shadow transition"
      >
        + Novo Projeto
      </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div
        *ngFor="let projeto of projetosDoBanco"
        class="bg-white rounded-xl shadow border-t-4 border-indigo-500 p-6 hover:shadow-lg transition"
      >
        <div class="flex justify-between items-start mb-4">
          <h2 class="text-xl font-bold text-gray-800 truncate">
            {{ projeto.title }}
          </h2>
          <span
            class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded"
            >Ativo</span
          >
        </div>

        <p class="text-gray-600 text-sm mb-4 line-clamp-2">
          {{ projeto.description }}
        </p>

        <div class="border-t pt-4 mt-2">
          <p
            class="text-xs text-gray-500 uppercase font-bold tracking-wider mb-1"
          >
            Cliente
          </p>
          <p class="text-sm font-medium text-gray-800">
            {{ projeto.client?.name || 'Cliente Desconhecido' }}
          </p>
        </div>

        <div class="mt-4">
          <button
            [routerLink]="['/admin/project', projeto.id]"
            class="w-full text-indigo-600 border border-indigo-600 hover:bg-indigo-50 font-medium py-2 rounded transition"
          >
            Gerenciar Etapas
          </button>
        </div>
      </div>

      <div
        *ngIf="projetosDoBanco.length === 0"
        class="col-span-full bg-white p-8 text-center rounded-xl shadow border border-dashed border-gray-300"
      >
        <p class="text-gray-500">
          Nenhum projeto encontrado. Clique em "Novo Projeto" para começar.
        </p>
      </div>
    </div>
  </main>
</div>
