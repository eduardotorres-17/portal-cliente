<div
  class="min-h-screen bg-zinc-950 flex text-zinc-100 selection:bg-lime-400 selection:text-zinc-950"
>
  <app-toast></app-toast>

  <aside
    class="w-64 bg-zinc-900 hidden md:flex flex-col border-r border-zinc-800"
  >
    <div class="p-8">
      <div class="flex items-center space-x-3 mb-10">
        <svg width="40" height="40" viewBox="0 0 120 120" fill="none">
          <rect width="120" height="120" rx="20" fill="#a21caf" />
          <path d="M85 35H35V85H85V60H60" stroke="#bef264" stroke-width="12" />
          <rect x="35" y="35" width="25" height="25" fill="#bef264" />
        </svg>
        <span class="text-xl font-black uppercase tracking-tighter"
          >Dev<span class="text-lime-400">Portal</span></span
        >
      </div>

      <nav class="space-y-4">
        <a
          routerLink="/admin"
          class="flex items-center space-x-3 bg-lime-400 text-zinc-950 p-3 font-bold uppercase text-xs tracking-widest shadow-[4px_4px_0_0_rgba(162,28,175,1)]"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
            ></path>
          </svg>
          <span>Projetos</span>
        </a>
        <a
          routerLink="/admin/users"
          class="flex items-center space-x-3 text-zinc-500 hover:text-lime-400 p-3 font-bold uppercase text-xs tracking-widest transition"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"
            ></path>
          </svg>
          <span>Usuários</span>
        </a>
      </nav>
    </div>

    <div class="p-6 mt-auto border-t border-zinc-800">
      <button
        (click)="authService.logout()"
        class="flex items-center space-x-3 text-zinc-500 hover:text-red-500 p-3 font-bold uppercase text-[10px] tracking-widest transition w-full"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
          ></path>
        </svg>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="flex-1 p-10 overflow-y-auto">
    <header class="flex justify-between items-end mb-16">
      <div>
        <h1
          class="text-5xl font-black uppercase tracking-tighter mb-2 text-white"
        >
          Console de <span class="text-lime-400">Projetos</span>
        </h1>
        <div class="h-2 w-24 bg-fuchsia-600"></div>
      </div>
      <button
        (click)="exibirModal = true"
        class="bg-lime-400 hover:bg-lime-500 text-zinc-950 font-black uppercase tracking-widest py-4 px-8 transition-all shadow-[6px_6px_0_0_rgba(162,28,175,1)] hover:translate-y-[-2px]"
      >
        + Criar Projeto
      </button>
    </header>

    <div
      *ngIf="isLoading"
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"
    >
      <div
        *ngFor="let i of [1, 2, 3]"
        class="h-64 bg-zinc-900 border border-zinc-800 animate-pulse"
      ></div>
    </div>

    <div
      *ngIf="!isLoading"
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"
    >
      <div
        *ngFor="let projeto of projetos"
        class="group bg-zinc-900 border-2 border-zinc-800 p-8 hover:border-lime-400 transition-all relative overflow-hidden flex flex-col justify-between"
      >
        <div>
          <div class="absolute top-0 right-0 p-4">
            <button
              (click)="excluirProjeto(projeto.id)"
              class="text-zinc-700 hover:text-red-500 transition"
            >
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                ></path>
              </svg>
            </button>
          </div>
          <div class="mb-6">
            <span
              class="text-[10px] font-black uppercase tracking-[0.2em] text-fuchsia-500 mb-2 block"
              >Projeto Ativo</span
            >
            <h3
              class="text-2xl font-black uppercase tracking-tight text-white group-hover:text-lime-400 transition"
            >
              {{ projeto.title }}
            </h3>
          </div>
          <p class="text-zinc-500 text-sm mb-8 line-clamp-2 leading-relaxed">
            {{ projeto.description }}
          </p>
        </div>
        <div
          class="flex items-center justify-between pt-6 border-t border-zinc-800"
        >
          <span class="text-[10px] font-bold uppercase text-zinc-400"
            >Cliente: {{ projeto.client?.name }}</span
          >
          <button
            [routerLink]="['/admin/project', projeto.id]"
            class="text-lime-400 font-black uppercase text-xs tracking-widest hover:underline decoration-2 underline-offset-8"
          >
            Inspecionar →
          </button>
        </div>
      </div>

      <div
        *ngIf="projetos.length === 0"
        class="col-span-full py-12 text-center border-2 border-dashed border-zinc-800"
      >
        <p class="text-zinc-500 font-bold uppercase tracking-widest">
          Nenhum projeto cadastrado.
        </p>
      </div>
    </div>

    <div
      *ngIf="exibirModal"
      class="fixed inset-0 bg-zinc-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4"
    >
      <div
        class="bg-zinc-900 border-4 border-lime-400 w-full max-w-md p-10 shadow-[20px_20px_0_0_rgba(162,28,175,1)]"
      >
        <h2
          class="text-3xl font-black uppercase tracking-tighter text-white mb-8"
        >
          Setup de Projeto
        </h2>

        <div class="space-y-6">
          <div class="relative">
            <input
              [(ngModel)]="novoProjeto.title"
              placeholder=" "
              class="block w-full px-0 py-3 bg-transparent border-0 border-b-2 border-zinc-700 text-white focus:outline-none focus:border-lime-400 peer"
            />
            <label
              class="absolute text-xs font-black uppercase tracking-widest text-zinc-500 -translate-y-6 top-3 peer-placeholder-shown:translate-y-0 peer-focus:-translate-y-6 transition-all"
              >Título</label
            >
          </div>

          <div class="relative">
            <textarea
              [(ngModel)]="novoProjeto.description"
              placeholder=" "
              rows="2"
              class="block w-full px-0 py-3 bg-transparent border-0 border-b-2 border-zinc-700 text-white focus:outline-none focus:border-lime-400 peer resize-none"
            ></textarea>
            <label
              class="absolute text-xs font-black uppercase tracking-widest text-zinc-500 -translate-y-6 top-3 peer-placeholder-shown:translate-y-0 peer-focus:-translate-y-6 transition-all"
              >Descrição</label
            >
          </div>

          <div class="relative pt-2">
            <select
              [(ngModel)]="novoProjeto.clientId"
              class="w-full bg-zinc-800 text-white p-3 border-0 border-b-2 border-zinc-700 focus:ring-0 outline-none uppercase font-bold text-xs tracking-widest"
            >
              <option value="">Vincular Cliente</option>
              <option *ngFor="let user of usuarios" [value]="user.id">
                {{ user.name }}
              </option>
            </select>
          </div>
        </div>

        <div class="flex space-x-4 mt-12">
          <button
            (click)="exibirModal = false"
            class="flex-1 py-4 font-black uppercase tracking-widest text-zinc-500 hover:text-white transition"
          >
            Abortar
          </button>
          <button
            (click)="salvarProjeto()"
            class="flex-1 py-4 font-black uppercase tracking-widest bg-lime-400 text-zinc-950 hover:bg-lime-500 transition"
          >
            Confirmar
          </button>
        </div>
      </div>
    </div>
  </main>
</div>
