<div class="min-h-screen bg-slate-50 flex">
  <aside class="w-64 bg-slate-900 hidden md:flex flex-col">
    <div class="p-6">
      <div class="flex items-center space-x-3">
        <div
          class="w-10 h-10 bg-indigo-500 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/20"
        >
          <span class="text-white font-bold text-xl">P</span>
        </div>
        <span class="text-white font-bold text-lg tracking-tight"
          >Portal Dev</span
        >
      </div>
    </div>

    <nav class="flex-1 px-4 space-y-2 mt-4">
      <a
        href="#"
        class="flex items-center space-x-3 bg-indigo-600 text-white p-3 rounded-xl transition shadow-md shadow-indigo-600/10"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
          ></path>
        </svg>
        <span class="font-medium">Projetos</span>
      </a>
    </nav>

    <div class="p-4 mt-auto border-t border-slate-800">
      <button
        (click)="authService.logout()"
        class="flex items-center space-x-3 text-slate-400 hover:text-white p-3 transition w-full"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
          ></path>
        </svg>
        <span>Sair do Sistema</span>
      </button>
    </div>
  </aside>

  <main class="flex-1 p-8 overflow-y-auto">
    <header class="flex justify-between items-center mb-10">
      <div>
        <h1 class="text-3xl font-bold text-slate-900">Seus Projetos</h1>
        <p class="text-slate-500 mt-1">
          Gerencie e acompanhe a evolução dos seus contratos.
        </p>
      </div>
      <button
        class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl transition flex items-center shadow-lg shadow-indigo-600/20"
      >
        <svg
          class="w-5 h-5 mr-2"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 4v16m8-8H4"
          ></path>
        </svg>
        Novo Projeto
      </button>
    </header>
  
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div
        *ngFor="let projeto of projetos"
        class="bg-white rounded-2xl border border-slate-200 p-6 hover:border-indigo-300 hover:shadow-xl hover:shadow-indigo-500/5 transition-all duration-300 group"
      >
        <div class="flex justify-between items-start mb-4">
          <div
            class="p-3 bg-slate-50 rounded-lg group-hover:bg-indigo-50 transition"
          >
            <svg
              class="w-6 h-6 text-slate-400 group-hover:text-indigo-500"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"
              ></path>
            </svg>
          </div>
          <span
            class="text-xs font-bold uppercase tracking-widest text-emerald-600 bg-emerald-50 px-2 py-1 rounded"
            >Ativo</span
          >
        </div>

        <h3 class="text-xl font-bold text-slate-900 mb-2">
          {{ projeto.title }}
        </h3>
        <p class="text-slate-500 text-sm line-clamp-2 mb-6">
          {{ projeto.description }}
        </p>

        <div
          class="flex items-center justify-between pt-6 border-t border-slate-50"
        >
          <div class="flex -space-x-2">
            <div
              class="w-8 h-8 rounded-full bg-slate-200 border-2 border-white flex items-center justify-center text-[10px] font-bold"
            >
              {{ projeto.client?.name?.charAt(0) }}
            </div>
          </div>
          <button
            [routerLink]="['/admin/project', projeto.id]"
            class="text-indigo-600 font-bold text-sm hover:text-indigo-500"
          >
            Detalhes →
          </button>
        </div>
      </div>
    </div>
  </main>
</div>
